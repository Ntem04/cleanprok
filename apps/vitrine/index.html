<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SÉCURITÉ : CSP durcie avec autorisation explicite de l'iframe Google Maps -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://maps.google.com https://www.google.com; frame-ancestors 'none'; upgrade-insecure-requests;"
    />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- SEO : Meta description et Open Graph -->
    <meta name="description" content="CleanPro Services — Solutions de nettoyage professionnelles, fiables et écologiques pour entreprises, commerces et espaces publics au Cameroun. Devis gratuit." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.cleanpro-services.cm/" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CleanPro Services — Nettoyage professionnel au Cameroun" />
    <meta property="og:description" content="Solutions de nettoyage professionnelles, fiables et écologiques pour entreprises et commerces. Devis gratuit." />
    <meta property="og:url" content="https://www.cleanpro-services.cm/" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CleanPro Services — Nettoyage professionnel" />
    <meta name="twitter:description" content="Solutions de nettoyage professionnelles et écologiques au Cameroun." />

    <!-- OPTIMISATION RÉSEAU : Préconnexion & Chargement prioritaire des polices sans reflow -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700;800;900&display=swap"
    />
    <link rel="preload" as="image" href="/icon.webp" type="image/webp" fetchpriority="high" />

    <title>CleanPro Services</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
